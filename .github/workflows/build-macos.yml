name: Build macOS package

# 推标签即发布到同一个 Release；推 main 或提 PR 只产出 Actions artifact。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify (arm64)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.15,<7"

      - name: Run self-checks
        run: |
          python -m compileall -q desktop.py app_api.py api person_profile analysis.py storage.py parsers.py profile_export.py chat_export.py chat_analysis.py fortune_app.py platform_support.py
          python test_core.py
          python test_fortune.py
          python desktop.py --self-test
          python chat-material-extractor/scripts/extract.py self-test

      - name: Build package
        env:
          PROPHET_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}
        run: bash ./build_macos.sh

      - name: Create release archive
        run: |
          # ditto 会保留 .app 内部的可执行权限与符号链接，zip 会丢
          ditto -c -k --keepParent dist-native/Prophet.app Prophet-macos-arm64.zip
          shasum -a 256 Prophet-macos-arm64.zip > Prophet-macos-arm64.zip.sha256
          cat Prophet-macos-arm64.zip.sha256

      # .app 传目录会丢失可执行权限，所以 artifact 里放完整 zip。
      # 下载后需要解压两次；正式分发请用 Release。
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prophet-macos-arm64-zipped
          path: |
            Prophet-macos-arm64.zip
            Prophet-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          files=(Prophet-macos-arm64.zip Prophet-macos-arm64.zip.sha256)
          # 两个平台的工作流都会往同一个 Release 上传，先建后传，已存在则跳过创建
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes || true
          gh release upload "$tag" "${files[@]}" --clobber
