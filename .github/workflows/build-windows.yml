name: Build Windows package

# 推标签即出 Release；推 main 或提 PR 只产出可下载的 Actions artifact。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.15,<7"

      - name: Run self-checks
        run: |
          python -m compileall -q desktop.py app_api.py api person_profile analysis.py storage.py parsers.py profile_export.py chat_export.py chat_analysis.py fortune_app.py
          python test_core.py
          python test_fortune.py
          python desktop.py --self-test
          python chat-material-extractor/scripts/extract.py self-test

      - name: Build package
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./build_windows.ps1

      - name: Create release archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist-native/Prophet/*" -DestinationPath "Prophet-windows-x64.zip" -Force
          $hash = (Get-FileHash "Prophet-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  Prophet-windows-x64.zip" | Set-Content -Path "Prophet-windows-x64.zip.sha256" -Encoding ascii
          Get-Item "Prophet-windows-x64.zip" | Select-Object Name, Length
          Get-Content "Prophet-windows-x64.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prophet-windows-x64
          path: |
            Prophet-windows-x64.zip
            Prophet-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = @("Prophet-windows-x64.zip", "Prophet-windows-x64.zip.sha256")
          gh release create $tag @files --title $tag --generate-notes
          if ($LASTEXITCODE -ne 0) {
            # 标签已存在同名 Release 时改为覆盖上传
            gh release upload $tag @files --clobber
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
