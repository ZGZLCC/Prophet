<!doctype html>
<html lang="zh-CN" class="is-starting">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Prophet · 本地工作台</title>
    <script>
      (() => {
        const saved = localStorage.getItem("prophet-theme");
        const choice = ["system", "light", "dark"].includes(saved) ? saved : "system";
        document.documentElement.dataset.theme = choice === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : choice;
      })();
    </script>
    <style>
      html {
        background: #ffffff;
      }

      html.is-starting,
      html.is-starting body {
        overflow: hidden;
      }

      .startup-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        color: #080808;
        background: #ffffff;
        opacity: 1;
        visibility: visible;
      }

      .startup-lockup {
        display: grid;
        justify-items: center;
        font-family: "WF Visual Sans Variable", Inter, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }

      .startup-splash.is-playing .startup-lockup {
        animation: prophet-splash-rise 2s linear both;
      }

      .startup-mark {
        display: block;
        width: 104px;
        height: 104px;
      }

      .startup-name {
        margin: 18px 0 0;
        color: inherit;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1;
      }

      @keyframes prophet-splash-rise {
        0% {
          opacity: 0;
          transform: translateY(24px) scale(0.98);
          animation-timing-function: cubic-bezier(0.37, 0, 0.63, 1);
        }
        20% {
          opacity: 0.22;
          transform: translateY(18px) scale(0.985);
        }
        50% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        80% {
          opacity: 1;
          transform: translateY(0) scale(1);
          animation-timing-function: cubic-bezier(0.4, 0, 1, 1);
        }
        100% {
          opacity: 0;
          transform: translateY(0) scale(1);
        }
      }

      html[data-theme="dark"],
      html[data-theme="dark"] .startup-splash {
        color: #f7f7f7;
        background: #080808;
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-splash {
          opacity: 1;
        }

        .startup-lockup {
          animation: none;
        }
      }
    </style>
    <link rel="stylesheet" href="styles.css?v=20260927-2" />
  </head>
  <body>
    <div id="startup-splash" class="startup-splash" role="status" aria-label="Prophet 正在启动">
      <div class="startup-lockup">
        <img class="startup-mark theme-icon-light" src="../assets/prophet_icon_light.png" alt="" />
        <img class="startup-mark theme-icon-dark" src="../assets/prophet_icon_dark.png" alt="" />
        <p class="startup-name">Prophet</p>
      </div>
    </div>

    <div id="app" class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand-lockup">
          <img class="brand-mark theme-icon-light" src="../assets/prophet_icon_light.png" alt="" />
          <img class="brand-mark theme-icon-dark" src="../assets/prophet_icon_dark.png" alt="" />
          <div>
            <p class="brand-name">Prophet</p>
            <p class="brand-subtitle">LOCAL WORKSPACE</p>
          </div>
        </div>

        <div class="sidebar-section-label">工作台</div>
        <nav id="primary-nav" class="primary-nav" aria-label="功能导航">
          <button class="nav-item is-active" type="button" data-route="profile">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.25"></circle><path d="M5.5 19.25c.9-3.1 3.08-4.65 6.5-4.65s5.6 1.55 6.5 4.65"></path></svg>
            <span>人物画像</span>
          </button>
          <button class="nav-item" type="button" data-route="export">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.75h8.25L18.5 8v12.25H6z"></path><path d="M14 3.75V8h4.5M8.75 12.25h6.5M8.75 15.5h6.5"></path></svg>
            <span>聊天导出</span>
          </button>
          <button class="nav-item" type="button" data-route="analysis">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19.25V11M12 19.25V5M19 19.25v-8"></path><path d="M3.75 19.25h16.5"></path></svg>
            <span>聊天分析</span>
          </button>
          <button class="nav-item" type="button" data-route="fortune">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.75"></circle><path d="m12 7.2 1.5 3.3 3.3 1.5-3.3 1.5-1.5 3.3-1.5-3.3-3.3-1.5 3.3-1.5z"></path></svg>
            <span>赛博算命</span>
          </button>
        </nav>

        <div class="sidebar-spacer"></div>
        <section class="local-health model-health" aria-live="polite">
          <div id="model-dot" class="status-dot is-loading"></div>
          <div>
            <strong id="model-label">正在读取模型设置</strong>
            <span id="model-detail">仅在需要解读时使用</span>
          </div>
        </section>
        <section class="local-health" aria-live="polite">
          <div id="health-dot" class="status-dot is-loading"></div>
          <div>
            <strong id="health-label">正在检查本地状态</strong>
            <span id="health-detail">准备连接 Python 桥接</span>
          </div>
        </section>
        <button id="sidebar-settings" class="sidebar-settings" type="button" data-open-settings="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.25a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5Z"></path><path d="m19.1 13.3 1.1.85-1.6 2.75-1.3-.5a7.9 7.9 0 0 1-1.55.9L15.55 18.7h-3.1l-.2-1.4a7.9 7.9 0 0 1-1.55-.9l-1.3.5-1.6-2.75 1.1-.85a7.35 7.35 0 0 1 0-1.8l-1.1-.85 1.6-2.75 1.3.5a7.9 7.9 0 0 1 1.55-.9l.2-1.4h3.1l.2 1.4a7.9 7.9 0 0 1 1.55.9l1.3-.5 1.6 2.75-1.1.85a7.35 7.35 0 0 1 0 1.8Z"></path></svg>
          <span>设置</span>
        </button>
      </aside>

      <main class="main-shell">
        <header class="topbar">
          <div class="topbar-context">
            <span class="eyebrow">PROPHET / LOCAL WORKSPACE</span>
            <span id="topbar-page-title" class="topbar-page-title">人物画像</span>
            <span id="bridge-status" class="bridge-status is-loading">桥接准备中</span>
          </div>
          <button id="top-settings" class="button button-secondary button-compact" type="button" data-open-settings="true">
            设置
          </button>
        </header>

        <section id="page-view" class="page-view" tabindex="-1" aria-live="polite">
          <div class="page-loading" role="status">正在载入工作台</div>
        </section>
        <button class="back-to-top" type="button" data-back-to-top aria-label="回到顶部" title="回到顶部">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg>
        </button>
      </main>
    </div>

    <div id="settings-modal" class="modal-layer" hidden>
      <div class="modal-backdrop" data-close-settings="true"></div>
      <section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title" aria-describedby="settings-description">
        <header class="dialog-header">
          <div>
            <span class="eyebrow">LOCAL CONFIGURATION</span>
            <h2 id="settings-title">设置</h2>
            <p id="settings-description">配置保存在.env</p>
          </div>
          <button id="settings-close" class="icon-button" type="button" aria-label="关闭设置">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg>
          </button>
        </header>

        <div class="dialog-body">
          <form id="appearance-settings-form" class="settings-section" data-submit-label="保存显示设置">
            <div class="section-heading">
              <div>
                <h3>显示</h3>
                <p>选择界面主题和时间显示所用的时区。</p>
              </div>
            </div>
            <label class="field">
              <span>主题</span>
              <select id="setting-theme" name="theme">
                <option value="system">跟随系统</option>
                <option value="light">亮</option>
                <option value="dark">暗</option>
              </select>
            </label>
            <label class="field">
              <span>时区</span>
              <select id="setting-timezone" name="timezone">
                <option value="Asia/Shanghai">北京</option>
                <option value="Asia/Hong_Kong">香港</option>
                <option value="Asia/Singapore">新加坡</option>
                <option value="Asia/Tokyo">东京</option>
                <option value="Europe/London">伦敦</option>
                <option value="Europe/Paris">巴黎</option>
                <option value="America/New_York">纽约</option>
                <option value="America/Los_Angeles">洛杉矶</option>
                <option value="Australia/Sydney">悉尼</option>
                <option value="UTC">协调世界时（UTC）</option>
              </select>
            </label>
            <div class="form-actions">
              <button class="button button-primary" type="submit">保存显示设置</button>
            </div>
          </form>

          <form id="model-settings-form" class="settings-section" data-submit-label="保存模型设置">
            <div class="section-heading">
              <div>
                <h3>模型连接</h3>
                <p>密钥只在 Python 侧保存，页面不会回显完整值。</p>
              </div>
              <span id="api-key-state" class="status-badge">未配置</span>
            </div>
            <div class="form-grid">
              <label class="field">
                <span>接口协议</span>
                <select id="setting-provider" name="provider">
                  <option value="openai-responses">OpenAI Responses</option>
                  <option value="openai-chat">OpenAI Chat Completions</option>
                  <option value="ollama">Ollama 本机接口</option>
                </select>
              </label>
              <label class="field">
                <span>模型名称</span>
                <input id="setting-model" name="model" type="text" autocomplete="off" placeholder="例如 gpt-5-mini" required />
              </label>
              <label class="field field-wide">
                <span>API 地址 <em>可选</em></span>
                <input id="setting-base-url" name="base_url" type="url" autocomplete="off" placeholder="官方接口可留空；兼容接口请填写服务地址" />
              </label>
              <label class="field field-wide">
                <span>API Key</span>
                <input id="setting-api-key" name="api_key" type="password" autocomplete="new-password" placeholder="留空表示保持现有配置" />
              </label>
            </div>
            <div id="model-settings-error" class="form-message is-error" role="alert" hidden></div>
            <div class="form-actions">
              <button class="button button-primary" type="submit">保存模型设置</button>
            </div>
          </form>

          <form id="path-settings-form" class="settings-section" data-submit-label="保存路径设置">
            <div class="section-heading">
              <div>
                <h3>本地路径</h3>
                <p>数据库迁移会使用 SQLite 备份方式，保留原有数据结构。</p>
              </div>
            </div>
            <div class="form-grid">
              <label class="field field-wide">
                <span>默认保存位置</span>
                <div class="input-with-action">
                  <input id="setting-output-dir" name="output_dir" type="text" autocomplete="off" />
                  <button id="choose-output-dir" class="button button-secondary button-input" type="button">选择文件夹</button>
                </div>
              </label>
              <label class="field field-wide">
                <span>默认数据库位置</span>
                <div class="input-with-action">
                  <input id="setting-database-dir" name="database_dir" type="text" autocomplete="off" />
                  <button id="choose-database-dir" class="button button-secondary button-input" type="button">选择文件夹</button>
                </div>
              </label>
            </div>
            <div id="path-settings-error" class="form-message is-error" role="alert" hidden></div>
            <div class="form-actions">
              <button class="button button-primary" type="submit">保存路径设置</button>
            </div>
          </form>
        </div>
      </section>
    </div>

    <div id="confirm-modal" class="modal-layer" hidden>
      <div class="modal-backdrop" data-action="cancel-confirm"></div>
      <section class="settings-dialog confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
        <div class="dialog-body">
          <h2 id="confirm-title">确认</h2>
          <p id="confirm-message"></p>
          <div class="form-actions">
            <button class="button button-danger" type="button" data-action="accept-confirm">确认</button>
            <button class="button button-secondary" type="button" data-action="cancel-confirm">取消</button>
          </div>
        </div>
      </section>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="fatal-error" class="fatal-error" role="alert" hidden></div>
    <script src="modules/core.js?v=20260921-1" defer></script>
    <script src="modules/profile.js?v=20260921-1" defer></script>
    <script src="modules/chat.js?v=20260921-2" defer></script>
    <script src="modules/fortune.js?v=20260921-2" defer></script>
    <script src="modules/common.js?v=20260921-1" defer></script>
    <script src="app.js?v=20260927-3" defer></script>
  </body>
</html>
